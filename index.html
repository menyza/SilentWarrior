<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3b4d83"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-v2.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192-v2.png"><meta name="apple-mobile-web-app-title" content="הלוחם השקט"><title>הלוחם השקט · היום שלי</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header><div class="brand"><img class="brand-icon" src="icon-v2.svg" alt="הלוחם השקט — צעד קדימה ושמש זורחת" width="34" height="34"><span>הלוחם השקט<small>AI LAB / עוגן לשגרה</small></span></div><span class="version">המסע שלך, בקצב שלך</span></header><main id="main"></main><nav aria-label="ניווט ראשי"><button data-page="today">◉ <span>היום שלי</span></button><button data-page="history">▥ <span>התקדמות</span></button><button data-page="weight">⚖ <span>משקל</span></button><button data-page="habits">☷ <span>ההרגלים שלי</span></button></nav><div id="toast" role="status" aria-live="polite"></div></div><dialog id="habit-detail" aria-labelledby="habit-detail-title"><h2 id="habit-detail-title"></h2><p id="habit-detail-text"></p><button id="detail-rest" hidden>מנוחה מתוכננת · 10 נק׳</button><div class="order-actions"><button id="move-earlier">הזזה מקום אחורה</button><button id="move-later">הזזה מקום קדימה</button></div><button id="close-detail" autofocus>הבנתי</button></dialog><dialog id="day-review" aria-labelledby="review-title"><h2 id="review-title">רגע לסיכום היום</h2><p id="review-summary"></p><form id="reflection-form"><label for="reflection-reason">מה אפיין את היום?</label><select id="reflection-reason" name="reason" required><option value="">בחירה…</option><option value="easy">היה קל למצוא מקום להרגלים</option><option value="busy">יום עמוס</option><option value="tired">הייתי עייף</option><option value="forgot">שכחתי לסמן או לבצע</option><option value="other">משהו אחר</option></select><button type="submit">שמירת סיכום</button></form><button id="skip-review">לא עכשיו</button><p>זהו סיכום אופציונלי. הוא לא סוגר את היום ולא משנה את הניקוד.</p></dialog><dialog id="weigh-in" aria-labelledby="weigh-in-title"><h2 id="weigh-in-title">⚖️ שקילת בוקר</h2><p>הזנת מדידה שומרת אותה במעקב המשקל ומשלימה את המשימה. הניקוד הוא על התיעוד, ללא קשר לערך המשקל.</p><form id="weigh-in-form"><input type="hidden" id="weigh-in-date" name="date"><label for="quick-weight">משקל בק״ג</label><input id="quick-weight" name="weight" type="number" inputmode="decimal" min="0.1" max="1000" step="0.1" required><button type="submit">שמירה והשלמה</button></form><button id="close-weigh-in">לא עכשיו</button></dialog><script type="module" src="app.js"></script></body></html>
